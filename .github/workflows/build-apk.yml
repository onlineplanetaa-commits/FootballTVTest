# LiveTV resolver build
name: Build Football TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Generate real PNG football app logo
        run: |
          python3 -m pip install --quiet pillow
          mkdir -p app/src/main/res/drawable-nodpi
          rm -f app/src/main/res/drawable/max_logo.xml
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          import math
          S = 512
          im = Image.new("RGB", (S, S))
          px = im.load()
          # Deep navy gradient background
          for y in range(S):
              for x in range(S):
                  glow = max(0, 1 - math.sqrt((x-256)**2 + (y-180)**2)/420)
                  px[x,y] = (int(4+5*glow), int(15+23*glow), int(34+42*glow))
          # Soft stadium-light glow behind the ball
          glow_layer = Image.new("RGBA", (S,S), (0,0,0,0))
          gd = ImageDraw.Draw(glow_layer)
          for r, a in [(150,8),(125,12),(100,17)]:
              gd.ellipse((256-r,132-r,256+r,132+r), fill=(24,132,255,a))
          im = Image.alpha_composite(im.convert("RGBA"), glow_layer.filter(ImageFilter.GaussianBlur(18)))
          d = ImageDraw.Draw(im)
          d.rounded_rectangle((7,7,505,505), radius=76, outline=(42,115,184,255), width=5)
          # Green stadium accent lines
          d.arc((34,26,478,470), 205, 335, fill=(45,226,112,180), width=4)
          # Draw a crisp, unmistakable black-and-white soccer ball
          cx, cy, r = 256, 124, 83
          d.ellipse((cx-r,cy-r,cx+r,cy+r), fill=(248,250,252,255), outline=(3,12,24,255), width=6)
          def polygon(center, radius, sides=5, rotation=-90):
              return [(center[0]+radius*math.cos(math.radians(rotation+i*360/sides)),
                       center[1]+radius*math.sin(math.radians(rotation+i*360/sides))) for i in range(sides)]
          # Central black pentagon and five surrounding panels
          center_pts = polygon((cx,cy), 27, 5, -90)
          d.polygon(center_pts, fill=(8,17,29,255))
          for i in range(5):
              ang = math.radians(-90+i*72)
              ox, oy = cx+52*math.cos(ang), cy+52*math.sin(ang)
              patch = polygon((ox,oy), 19, 5, -90+i*72)
              d.polygon(patch, fill=(8,17,29,255))
              d.line((center_pts[i][0],center_pts[i][1],ox,oy), fill=(8,17,29,255), width=3)
          # Slight inner highlight gives the ball a clean, dimensional finish
          d.arc((cx-r+8,cy-r+8,cx+r-8,cy+r-8), 200, 305, fill=(255,255,255,220), width=3)
          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          title_font = ImageFont.truetype(font_path, 83)
          title = "МАКС"
          box = d.textbbox((0,0), title, font=title_font, stroke_width=1)
          d.text(((S-(box[2]-box[0]))//2, 222), title, font=title_font,
                 fill=(255,255,255,255), stroke_width=1, stroke_fill=(9,24,45,255))
          # Bold green divider
          d.rounded_rectangle((76,322,436,331), radius=5, fill=(45,231,112,255))
          sub_font = ImageFont.truetype(font_path, 28)
          for label, y in [("ФУТБОЛ",350), ("ОНЛАЙН",392)]:
              box = d.textbbox((0,0), label, font=sub_font)
              d.text(((S-(box[2]-box[0]))//2, y), label, font=sub_font, fill=(239,246,255,255))
          im.convert("RGB").save("app/src/main/res/drawable-nodpi/app_icon.png", optimize=True)
          PY

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballTV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# trigger rebuild
