# LiveTV resolver build
name: Build Football TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Generate real PNG football app logo
        run: |
          python3 -m pip install --quiet pillow
          mkdir -p app/src/main/res/drawable-nodpi
          rm -f app/src/main/res/drawable/max_logo.xml
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          import math
          S=512
          im=Image.new("RGB",(S,S),(5,16,37))
          px=im.load()
          for y in range(S):
              for x in range(S):
                  glow=max(0,1-math.sqrt((x-256)**2+(y-165)**2)/430)
                  px[x,y]=(int(4+5*glow),int(14+23*glow),int(34+45*glow))
          im=im.convert("RGBA")
          gl=Image.new("RGBA",(S,S),(0,0,0,0))
          ImageDraw.Draw(gl).ellipse((118,12,394,288),fill=(0,145,255,50))
          im=Image.alpha_composite(im,gl.filter(ImageFilter.GaussianBlur(22)))
          d=ImageDraw.Draw(im)
          d.rounded_rectangle((7,7,505,505),radius=70,outline=(52,126,194,255),width=5)
          cx,cy,r=256,125,79
          d.ellipse((cx-r,cy-r,cx+r,cy+r),fill=(246,248,250,255),outline=(1,8,18,255),width=7)
          def pent(cx,cy,r,rot=-90):
              return [(cx+r*math.cos(math.radians(rot+i*72)),cy+r*math.sin(math.radians(rot+i*72))) for i in range(5)]
          center=pent(cx,cy,26,-90)
          d.polygon(center,fill=(4,12,24,255))
          for i in range(5):
              ang=math.radians(-90+i*72)
              ox,oy=cx+53*math.cos(ang),cy+53*math.sin(ang)
              d.polygon(pent(ox,oy,19,-90+i*72),fill=(4,12,24,255))
              d.line((center[i][0],center[i][1],ox,oy),fill=(4,12,24,255),width=4)
          d.arc((cx-r+10,cy-r+10,cx+r-10,cy+r-10),195,280,fill=(255,255,255,230),width=4)
          fontpath="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          def centered(txt,y,font,fill,stroke=0,strokefill=(0,0,0,255)):
              b=d.textbbox((0,0),txt,font=font,stroke_width=stroke)
              d.text(((S-(b[2]-b[0]))//2,y),txt,font=font,fill=fill,stroke_width=stroke,stroke_fill=strokefill)
          centered("МАКС",222,ImageFont.truetype(fontpath,86),(255,255,255,255),2,(4,17,35,255))
          d.rounded_rectangle((72,323,440,333),radius=5,fill=(44,235,111,255))
          f2=ImageFont.truetype(fontpath,29)
          centered("ФУТБОЛ",350,f2,(245,249,255,255))
          centered("ОНЛАЙН",392,f2,(245,249,255,255))
          im.convert("RGB").save("app/src/main/res/drawable-nodpi/app_icon.png",optimize=True)
          PY

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballTV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# trigger rebuild
