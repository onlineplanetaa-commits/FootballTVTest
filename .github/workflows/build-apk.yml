# LiveTV resolver build
name: Build Football TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Create clean app icon with readable Cyrillic
        run: |
          python3 -m pip install --quiet pillow
          mkdir -p app/src/main/res/drawable-nodpi
          rm -f app/src/main/res/drawable/max_logo.xml
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import math
          S = 512
          im = Image.new("RGB", (S, S), (5, 20, 43))
          d = ImageDraw.Draw(im)
          d.rounded_rectangle((8,8,504,504), radius=84, fill=(7,26,54), outline=(39,112,186), width=8)
          d.ellipse((102,22,410,330), fill=(14,54,100))
          cx, cy, r = 256, 139, 91
          d.ellipse((cx-r,cy-r,cx+r,cy+r), fill=(250,251,253), outline=(8,18,32), width=7)
          pts = [(cx+31*math.cos(math.radians(-90+i*72)), cy+31*math.sin(math.radians(-90+i*72))) for i in range(5)]
          d.polygon(pts, fill=(9,20,34))
          for i in range(5):
              a = math.radians(-90+i*72)
              px, py = cx+65*math.cos(a), cy+65*math.sin(a)
              p = [(px+18*math.cos(a+math.radians(-90+j*72)), py+18*math.sin(a+math.radians(-90+j*72))) for j in range(5)]
              d.polygon(p, fill=(9,20,34))
          font = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          f = ImageFont.truetype(font, 94)
          title = "МАКС"
          b = d.textbbox((0,0), title, font=f)
          d.text(((S-(b[2]-b[0]))//2, 246), title, font=f, fill=(255,255,255))
          d.rounded_rectangle((70,360,442,370), radius=5, fill=(40,231,101))
          f2 = ImageFont.truetype(font, 31)
          for label, y in [("ФУТБОЛ",384),("ОНЛАЙН",427)]:
              b = d.textbbox((0,0), label, font=f2)
              d.text(((S-(b[2]-b[0]))//2, y), label, font=f2, fill=(240,246,255))
          im.save("app/src/main/res/drawable-nodpi/app_icon.png", optimize=True)
          PY

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballTV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# trigger rebuild
