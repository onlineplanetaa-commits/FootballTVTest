name: Build Football TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Patch LiveTV resolver for persistent WebView session
        run: |
          python3 - <<'PY'
            from pathlib import Path
            p = Path("app/src/main/java/com/worldgonemad/footballtv/MainActivity.java")
            s = p.read_text()
            old = """        releasePlayer();
          playerScreen = true;

          LinearLayout root = new LinearLayout(this);
  """
            new = """        releasePlayerOnly();
          playerScreen = true;

          LinearLayout root = new LinearLayout(this);
  """
            if old not in s:
                raise SystemExit("playStreamCandidates start block not found")
            s = s.replace(old, new, 1)

            old = """                        if (player != null) {
                              releasePlayer();
                          }
                          playStreamCandidates(match, streams, nextIndex);
  """
            new = """                        if (player != null) {
                              releasePlayerOnly();
                          }
                          playStreamCandidates(match, streams, nextIndex);
  """
            if old not in s:
                raise SystemExit("player error block not found")
            s = s.replace(old, new, 1)

            marker = """    private void releasePlayer() {
  """
            method = """    private void releasePlayerOnly() {
          if (playerView != null) {
              try {
                  playerView.setPlayer(null);
              } catch (Exception ignored) {}
          }

          if (player != null) {
              try {
                  player.stop();
              } catch (Exception ignored) {}

              try {
                  player.release();
              } catch (Exception ignored) {}

              player = null;
          }

          playerView = null;
      }

  """
            if marker not in s:
                raise SystemExit("releasePlayer marker not found")
            s = s.replace(marker, method + marker, 1)

            p.write_text(s)
          PY

        - name: Build APK
          run: gradle --no-daemon assembleDebug

        - name: Upload APK
          uses: actions/upload-artifact@v4
          with:
            name: FootballTV-debug-apk
            path: app/build/outputs/apk/debug/app-debug.apk
            if-no-files-found: error
