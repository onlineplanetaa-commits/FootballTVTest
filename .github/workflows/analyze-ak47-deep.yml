name: Deep AK47 analysis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        run: |
          set -e
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://ak47sports.app/app/AK47Sports_V1.6.apk" -o AK47Sports_V1.6.apk
          ls -lh AK47Sports_V1.6.apk

      - name: Install JADX
        run: |
          set -e
          curl -L --fail --retry 3 "https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip" -o /tmp/jadx.zip
          rm -rf /tmp/jadx
          mkdir /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          JADX_BIN=$(find /tmp/jadx -type f -name jadx | head -n 1)
          test -n "$JADX_BIN"
          chmod +x "$JADX_BIN"
          echo "JADX_BIN=$JADX_BIN" >> "$GITHUB_ENV"

      - name: Decompile and extract resolver
        run: |
          set +e
          rm -rf source
          "$JADX_BIN" --show-bad-code -q -d source AK47Sports_V1.6.apk
          mkdir -p deep-analysis
          grep -Rni -E -C 15 'api_host|api_url|foot_live_url|cric_live_url|iptv_playlist|live_events|foot_score|cric_score|m3u8|HlsMediaSource|ExoPlayer|MediaItem|Retrofit|OkHttp|WebView|app\.txt' source 2>/dev/null > deep-analysis/network-context.txt || true
          find source -type f 2>/dev/null | grep -Ei 'aksports|live|playlist|player|api|channel|score|home' | sort > deep-analysis/relevant-files.txt || true
          grep -Rni -E 'https?://|api_host|api_url|foot_live_url|live_events|foot_score|m3u8' source 2>/dev/null | head -n 20000 > deep-analysis/all-network-hits.txt || true
          find source -type f -name '*.java' -print0 2>/dev/null | xargs -0 grep -l -E 'foot_live_url|live_events|foot_score|api_host|api_url' 2>/dev/null | sort -u > deep-analysis/resolver-files.txt || true
          echo "=== candidate resolver files ==="
          cat deep-analysis/resolver-files.txt
          echo "=== relevant network context ==="
          sed -n '1,12000p' deep-analysis/network-context.txt

      - name: Upload deep analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ak47-deep-analysis
          path: |
            deep-analysis
            source
          retention-days: 3
          compression-level: 6
