name: Analyze AK47 Sports V1.6

on:
  push:
    paths:
      - ".github/workflows/analyze-ak47-v16.yml"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Download official APK
        run: |
          set -e
          curl -L --fail --retry 3 -A "Mozilla/5.0"             "https://ak47sports.app/app/AK47Sports_V1.6.apk"             -o AK47Sports_V1.6.apk
          ls -lh AK47Sports_V1.6.apk
      - name: Extract and inspect
        run: |
          set -e
          rm -rf apk_extract source
          mkdir apk_extract
          unzip -q AK47Sports_V1.6.apk -d apk_extract

          echo "=== APK FILE LIST ===" > analysis.txt
          find apk_extract -type f | sort >> analysis.txt

          echo >> analysis.txt
          echo "=== URLS FROM DEX ===" >> analysis.txt
          find apk_extract -name 'classes*.dex' -print0 |
            xargs -0 strings -a 2>/dev/null |
            grep -Eo 'https?://[^[:space:]'"'"'">)]+' |
            sort -u >> analysis.txt || true

          echo >> analysis.txt
          echo "=== NETWORK / PLAYLIST STRINGS ===" >> analysis.txt
          find apk_extract -name 'classes*.dex' -print0 |
            xargs -0 strings -a 2>/dev/null |
            grep -Ei 'api_host|api_url|iptv_playlist|foot_live_url|cric_live_url|playlist|m3u8?|xtream|live_events|foot_score|cric_score' |
            sort -u >> analysis.txt || true

          echo >> analysis.txt
          echo "=== NATIVE LIBRARY URL STRINGS ===" >> analysis.txt
          find apk_extract/lib -type f -print0 2>/dev/null |
            xargs -0 strings -a 2>/dev/null |
            grep -Eoi 'https?://[^[:space:]'"'"'">)]+' |
            sort -u >> analysis.txt || true

          echo >> analysis.txt
          echo "=== DECOMPILED AKSPORTS SOURCE ===" >> analysis.txt
          curl -L --fail --retry 3 \
            "https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip" \
            -o /tmp/jadx.zip
          rm -rf /tmp/jadx
          mkdir /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          JADX_BIN=$(find /tmp/jadx -type f -name jadx | head -n 1)
          test -n "$JADX_BIN"
          chmod +x "$JADX_BIN"
          "$JADX_BIN" -q -d source AK47Sports_V1.6.apk || true
          grep -RniE 'api_host|api_url|foot_live_url|cric_live_url|iptv_playlist|playlist|m3u8?|xtream|http://|https://|Retrofit|OkHttp|WebView' source/sources/app/aksports/live 2>/dev/null |
            head -n 1000 >> analysis.txt || true

          echo >> analysis.txt
          echo "=== RELEVANT AKSPORTS SOURCE FILES ===" >> analysis.txt
          find source -type f 2>/dev/null |
            grep -Ei 'aksports|playlist|player|api|channel|score|web' |
            sort |
            head -n 1000 >> analysis.txt || true

          echo >> analysis.txt
          echo "=== MANIFEST STRINGS ===" >> analysis.txt
          unzip -p AK47Sports_V1.6.apk AndroidManifest.xml 2>/dev/null | strings -a >> analysis.txt || true

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: ak47-v16-analysis
          path: analysis.txt
          retention-days: 3
